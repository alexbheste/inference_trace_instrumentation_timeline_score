[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alexbheste-inference_trace_instrumentation_timeline_score"
version = "0.1.0"
description = "解析时间标记，排列自动驾驶感知工程师·推理链路的追踪埋点的发生顺序，标出间隔异常与逆序事件"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "alexbheste" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://alexbheste.github.io"
Repository = "https://github.com/alexbheste/inference_trace_instrumentation_timeline_score"
Issues = "https://github.com/alexbheste/inference_trace_instrumentation_timeline_score/issues"

[project.scripts]
inference_trace_instrumentation_timeline_score = "inference_trace_instrumentation_timeline_score:main"

[tool.setuptools]
py-modules = ["inference_trace_instrumentation_timeline_score"]
